<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talent Nation | Battle Request</title>
<base target="_top">
<meta charset="utf-8">
<style>
  :root { --purple:#8e6fbf; --deep:#6b4fa0; --plum:#3b2a5a; --bg:#f6f2fb; --card:#fff; --line:#ded3ee; --text:#2a1f3d; --muted:#6f6385; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#17111f; --card:#221a30; --line:#3a2d52; --text:#f1ebfa; --muted:#aa9cc4; --plum:#e3d6fa; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,Arial,sans-serif; }
  .wrap { max-width:560px; margin:0 auto; padding:20px 16px 48px; }
  .logo { display:block; width:200px; max-width:60%; margin:8px auto 4px; }
  h1 { font-size:22px; text-align:center; margin:4px 0 4px; color:var(--plum); }
  .sub { text-align:center; color:var(--muted); margin:0 0 18px; font-size:14px; }
  form, .done { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; }
  label { display:block; font-weight:600; font-size:14px; margin:14px 0 6px; }
  label small { font-weight:400; color:var(--muted); }
  input, select, textarea { width:100%; padding:11px 12px; font:inherit; color:var(--text); background:var(--card);
    border:1px solid var(--line); border-radius:10px; }
  input:focus, select:focus, textarea:focus { outline:2px solid var(--purple); border-color:var(--purple); }
  textarea { min-height:80px; resize:vertical; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:420px) { .row { grid-template-columns:1fr; } }
  button { width:100%; margin-top:20px; padding:13px; border:0; border-radius:10px; font:inherit; font-weight:700;
    color:#fff; background:var(--deep); cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  .err { color:#c0392b; font-size:14px; margin-top:12px; min-height:18px; }
  .done { text-align:center; display:none; }
  .done h2 { color:var(--plum); margin:6px 0; }
  .hp { position:absolute; left:-9999px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo"><img src="../logo.webp" alt="Talent Nation" style="width:100%;height:auto;display:block"></div>
  <h1>Battle Scheduling Request</h1>
  <p class="sub">Fill this out and we'll find you a battle. All times are <b>EST</b>.</p>

  <form id="f" autocomplete="off">
    <div class="row">
      <div><label>Username <small>(TikTok)</small></label><input name="username" required maxlength="60" placeholder="yourusername"></div>
      <div><label>Discord name</label><input name="discord" maxlength="60" placeholder="optional"></div>
    </div>

    <div class="row">
      <div><label>Preferred date</label><input type="date" name="date" id="date" required></div>
      <div><label>Preferred time <small>(EST)</small></label><input type="time" name="time" required></div>
    </div>

    <label>Backup date / time <small>(optional)</small></label>
    <input name="backup" maxlength="120" placeholder="e.g. Sat 9/26 anytime after 8 PM EST">

    <div class="row">
      <div><label>Battle type</label>
        <select name="type" required><option value="">Select…</option>
          <option>1 + Done</option><option>2/3</option>
        </select></div>
      <div><label>Format (VS.)</label>
        <select name="vs" required><option value="">Select…</option>
          <option>1v1</option><option>2v2</option><option>Series</option>
        </select></div>
    </div>

    <div class="row">
      <div><label>Powerups?</label>
        <select name="powerups" required><option value="">Select…</option>
          <option>NPU</option><option>PU</option>
        </select></div>
      <div><label>Diamond estimate</label>
        <select name="diamond" required><option value="">Select…</option>
          <option>0-5K</option><option>5-10K</option><option>10-20K</option><option>20-30K</option><option>30-40K</option><option>40-50K</option><option>50-75K</option><option>75-100K</option><option>100K+</option>
        </select></div>
    </div>

    <div id="c2wrap" style="display:none">
      <label>Second creator <small>(2v2 &middot; TikTok username)</small></label>
      <input name="creator2" maxlength="40" placeholder="secondcreator">
    </div>

    <label>18+ <small>(TikTok live setting)</small></label>
    <select name="adult" required><option value="">Select…</option><option value="Yes">ON</option><option value="No">OFF</option></select>

    <label>Notes <small>(optional)</small></label>
    <textarea name="notes" maxlength="500" placeholder="Opponent preferences, anything we should know…"></textarea>

    <input class="hp" name="website" tabindex="-1" autocomplete="off">
    <div class="err" id="err" role="alert"></div>
    <button id="go" type="submit">Submit request</button>
  </form>

  <div class="done" id="done">
    <h2>You're in the queue!</h2>
    <p>We got your request and will reach out on Discord once your battle is confirmed.</p>
    <button type="button" id="again">Submit another</button>
  </div>
</div>

<script>
var API = 'https://script.google.com/macros/s/AKfycbysJCwJg4qKWrTiL5HMG1gG4w9LRCx0xlrwXkEVJwlZpC9KqsL8-YIedVtpgKkCf-hqvA/exec';
function api(name, params, data) {
  var q = new URLSearchParams({ api: name });
  Object.keys(params || {}).forEach(function (k) { q.set(k, params[k]); });
  if (data) q.set('data', JSON.stringify(data));
  return fetch(API + '?' + q.toString(), { redirect: 'follow' })
    .then(function (r) { return r.json(); })
    .then(function (j) { if (!j.ok) throw new Error(j.error || 'Something went wrong'); return j.result; });
}
  var f = document.getElementById('f'), err = document.getElementById('err'), go = document.getElementById('go');
  var today = new Date(); today.setMinutes(today.getMinutes() - today.getTimezoneOffset());
  document.getElementById('date').min = today.toISOString().slice(0, 10);

  f.vs.addEventListener('change', function () {
    document.getElementById('c2wrap').style.display = f.vs.value === '2v2' ? 'block' : 'none';
    f.creator2.required = f.vs.value === '2v2';
  });

  f.addEventListener('submit', function (e) {
    e.preventDefault();
    if (f.website.value) return; // honeypot
    err.textContent = '';
    go.disabled = true; go.textContent = 'Sending…';
    var d = {};
    ['username','discord','date','time','backup','type','vs','powerups','diamond','notes','creator2','adult'].forEach(function (k) { d[k] = f[k].value; });
    api('submit', {}, d).then(function () {
        f.style.display = 'none';
        document.getElementById('done').style.display = 'block';
      }).catch(function (x) {
        err.textContent = (x && x.message || 'Something went wrong').replace(/^Error:\s*/, '');
        go.disabled = false; go.textContent = 'Submit request';
      });
  });
  document.getElementById('again').onclick = function () {
    f.reset(); f.style.display = 'block'; document.getElementById('done').style.display = 'none';
    document.getElementById('c2wrap').style.display = 'none';
    go.disabled = false; go.textContent = 'Submit request';
  };
</script>
</body>
</html>
