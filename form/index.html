<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talent Nation | Battle Request</title>
<style>*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:#f1ebfb;font-family:-apple-system,'Segoe UI',system-ui,Arial,sans-serif;color:#2a1f3d;font-size:15px}
button{font:inherit;cursor:pointer}
.hero2{position:relative;line-height:0;background:#0b0620}
.hero2 img{width:100%;display:block}
.sky{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.sky .s{position:absolute;width:var(--z,2px);height:var(--z,2px);margin:calc(var(--z,2px)/-2) 0 0 calc(var(--z,2px)/-2);border-radius:50%;background:#fff;box-shadow:0 0 6px 1px rgba(255,255,255,.85);opacity:.15;animation:tw var(--t,3.4s) ease-in-out infinite;animation-delay:var(--d,0s)}
.sky .sp{background:none;box-shadow:none}
.sky .sp::before,.sky .sp::after{content:"";position:absolute;left:50%;top:50%}
.sky .sp::before{width:100%;height:1.5px;transform:translate(-50%,-50%);background:linear-gradient(90deg,transparent,#fff,transparent)}
.sky .sp::after{width:1.5px;height:100%;transform:translate(-50%,-50%);background:linear-gradient(180deg,transparent,#fff,transparent)}
.sky .bulb{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:radial-gradient(circle,rgba(255,240,200,.95),rgba(255,200,120,.35) 45%,transparent 70%);mix-blend-mode:screen;animation:glow 2.8s ease-in-out infinite;animation-delay:var(--d,0s)}
.sky .bulb.d{display:none}
@keyframes tw{0%,100%{opacity:.12;transform:scale(.6)}50%{opacity:1;transform:scale(1.25)}}
@keyframes glow{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.6)}}
@media (prefers-reduced-motion:reduce){.sky *{animation:none!important;opacity:.7}}
.ht{position:absolute;z-index:2;left:20px;right:20px;top:18px;line-height:1.4}
.ht h1{margin:0 0 6px;font-family:Georgia,'Times New Roman',serif;font-size:34px;line-height:1.1;color:#fff;text-shadow:0 2px 16px rgba(10,4,40,.9)}
.ht p{margin:0;color:#efe6ff;font-size:14.5px;max-width:430px;text-shadow:0 1px 10px rgba(10,4,40,.95)}
@media (min-width:700px){.sky .bulb.m{display:none}.sky .bulb.d{display:block}.ht{left:5%;right:auto;top:50%;transform:translateY(-50%);max-width:38%}.ht h1{font-size:clamp(30px,4.2vw,46px)}.ht p{font-size:15px}}
.wrap{max-width:1000px;margin:0 auto;padding:22px 16px 40px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.tabs{display:flex;gap:6px;background:#fff;border:1px solid #e0d4f5;border-radius:99px;padding:5px}
.tab{padding:10px 18px;border-radius:99px;font-weight:600;font-size:15px;color:#5b4a82;cursor:pointer}
.tab.on{background:linear-gradient(135deg,#f06bc2,#8b5cf6);color:#fff;box-shadow:0 6px 18px rgba(139,92,246,.4)}
.tab b{display:inline-block;margin-left:8px;padding:1px 9px;border-radius:99px;background:rgba(139,92,246,.18);font-size:12px}
.tab.on b{background:rgba(255,255,255,.25)}
.msg{border-radius:99px;padding:12px 18px;font-weight:600;font-size:15px;background:#fff;border:1px solid #cdbcf0;color:#5b3ea8}
.note{color:#6f6385;font-size:13px;line-height:1.55;margin:4px 4px 18px}
.tile{position:relative;background:linear-gradient(160deg,#2b1760 0%,#1e0f47 100%);border:1px solid rgba(190,160,255,.22);border-radius:28px;padding:22px;margin-bottom:20px;box-shadow:0 14px 34px rgba(30,15,71,.35);color:#f3ecff}
.tile::before{content:"";position:absolute;left:22px;right:22px;top:0;height:4px;border-radius:0 0 8px 8px;background:linear-gradient(90deg,#f06bc2,#8b5cf6)}
.when{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.chip{border-radius:99px;padding:9px 16px;background:rgba(255,255,255,.08);border:1px solid rgba(190,160,255,.25);font-weight:600;font-size:15px;color:#f3ecff}
.chip.hot{background:linear-gradient(135deg,rgba(240,107,194,.28),rgba(139,92,246,.28));border-color:rgba(240,150,215,.5)}
.who{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.cr{display:flex;align-items:center;gap:12px;font-weight:700;font-size:18px;color:#f3ecff;text-decoration:none}
.cr:hover span:last-child{text-decoration:underline}
.av{width:52px;height:52px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:19px;color:#fff;background:linear-gradient(135deg,#8b5cf6,#c26be8);object-fit:cover;outline:3px solid #f06bc2;outline-offset:-1px;flex:none;overflow:hidden}
.bubbles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:6px}
.b{border-radius:20px;padding:14px 16px;background:rgba(255,255,255,.07);border:1px solid rgba(190,160,255,.2)}
.b small{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:#cbbcf0;font-weight:700;margin-bottom:6px}
.b .v{font-size:19px;font-weight:700;color:#f3ecff}
.pill{display:inline-block;padding:6px 14px;border-radius:99px;font-size:14px;font-weight:700}
.p-type{background:#3a2275;color:#e3d4ff;border:1px solid #8b5cf6}
.p-pu{background:linear-gradient(135deg,#f06bc2,#c26be8);color:#fff}
.p-npu{background:transparent;color:#f5b8e3;border:1px solid #f06bc2}
.p-18{background:rgba(255,255,255,.1);color:#e3d4ff;border:1px solid rgba(190,160,255,.4)}
.p-on{background:#8b5cf6;color:#fff;border-color:#8b5cf6}
.p-conf{background:rgba(139,92,246,.28);color:#e8dcff;border:1px solid #8b5cf6}
.p-pend{background:rgba(240,107,194,.18);color:#ffc0ea;border:1px solid #f06bc2}
.sub2{font-size:12px;color:#cbbcf0;margin-top:5px}
.side{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.formbox{margin-top:18px;padding:18px;border-radius:22px;background:rgba(10,4,32,.55);border:1px solid rgba(190,160,255,.18);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;color-scheme:dark}
.formbox label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#cbbcf0;font-weight:700;margin-bottom:6px}
.formbox input,.formbox select,.dk input,.dk select,.dk textarea{width:100%;border-radius:16px;padding:14px 16px;font:inherit;font-size:15px;color:#f3ecff;background:rgba(255,255,255,.07);border:1px solid rgba(190,160,255,.28);outline:none}
.formbox input::placeholder,.dk input::placeholder,.dk textarea::placeholder{color:#9d8bc9}
.formbox input:focus,.formbox select:focus,.dk input:focus,.dk select:focus,.dk textarea:focus{border-color:#f06bc2;box-shadow:0 0 0 3px rgba(240,107,194,.25)}
.formbox option,.dk option{background:#241250;color:#f3ecff}
.wide{grid-column:1 / -1}
.go{grid-column:1 / -1;display:flex;gap:10px}
.accept{flex:1;text-align:center;padding:16px;border:0;border-radius:99px;font-weight:700;font-size:17px;color:#fff;background:linear-gradient(135deg,#f06bc2,#8b5cf6);box-shadow:0 10px 26px rgba(240,107,194,.4)}
.accept:disabled{opacity:.6}
.ask{padding:16px 20px;border-radius:99px;font-weight:600;font-size:15px;background:rgba(139,92,246,.22);border:1px solid rgba(190,160,255,.45);color:#fff}
.err{grid-column:1 / -1;color:#ffb3c9;font-size:14px}
.sent{margin-top:16px;padding:16px;border-radius:20px;background:rgba(139,92,246,.25);border:1px solid #8b5cf6;font-weight:600;color:#efe6ff}
.empty{text-align:center;color:#6f6385;padding:44px 0}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#2b1760;color:#fff;padding:12px 18px;border-radius:99px;display:none;z-index:30;max-width:92%;text-align:center;box-shadow:0 10px 30px rgba(30,15,71,.5)}
.hide{display:none!important}
@media (min-width:760px){.who{flex-direction:row;gap:26px;flex-wrap:wrap}.bubbles{grid-template-columns:repeat(4,minmax(0,1fr))}.formbox{grid-template-columns:repeat(3,minmax(0,1fr))}.wrap{padding:28px 30px 50px}}
.card{max-width:640px;margin:0 auto;background:linear-gradient(160deg,#2b1760 0%,#1e0f47 100%);border:1px solid rgba(190,160,255,.22);border-radius:28px;padding:26px 22px;box-shadow:0 14px 34px rgba(30,15,71,.35);color:#f3ecff;color-scheme:dark;position:relative}
.card::before{content:"";position:absolute;left:22px;right:22px;top:0;height:4px;border-radius:0 0 8px 8px;background:linear-gradient(90deg,#f06bc2,#8b5cf6)}
.card label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#cbbcf0;font-weight:700;margin:18px 0 7px}
.card label small{text-transform:none;letter-spacing:0;font-weight:400;color:#b3a2dc}
.card input,.card select,.card textarea{width:100%;border-radius:16px;padding:14px 16px;font:inherit;font-size:16px;color:#f3ecff;background:rgba(255,255,255,.07);border:1px solid rgba(190,160,255,.28);outline:none}
.card textarea{min-height:100px;resize:vertical}
.card input:focus,.card select:focus,.card textarea:focus{border-color:#f06bc2;box-shadow:0 0 0 3px rgba(240,107,194,.25)}
.card option{background:#241250;color:#f3ecff}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:460px){.row2{grid-template-columns:1fr}}
.hp{position:absolute;left:-9999px}
.card .accept{width:100%;margin-top:24px}
.err{margin-top:14px;min-height:18px}
.done{display:none;max-width:640px;margin:0 auto;text-align:center;background:linear-gradient(160deg,#2b1760,#1e0f47);border:1px solid rgba(190,160,255,.22);border-radius:28px;padding:34px 22px;color:#f3ecff}
.done h2{margin:0 0 8px;font-family:Georgia,serif;font-size:28px}.done p{color:#e3d4ff;line-height:1.55}
.page-sub{max-width:640px;margin:0 auto 18px;text-align:center;color:#6f6385;font-size:14px}
</style></head>

<div class="ht"><h1>Request a Battle</h1><p>Fill this out and we'll find you a match. All times are EST.</p></div></header>

<main class="wrap">
  <form id="f" class="card" autocomplete="off">
    <div class="row2" style="margin-top:-4px">
      <div><label>Username <small>(TikTok)</small></label><input name="username" required maxlength="60" placeholder="yourusername"></div>
      <div><label>Discord name</label><input name="discord" maxlength="60" placeholder="optional"></div>
    </div>
    <div class="row2">
      <div><label>Preferred date</label><input type="date" name="date" id="date" required></div>
      <div><label>Preferred time <small>(EST)</small></label><input type="time" name="time" required></div>
    </div>
    <label>Backup date / time <small>(optional)</small></label>
    <input name="backup" maxlength="120" placeholder="e.g. Sat 9/26 anytime after 8 PM EST">
    <div class="row2">
      <div><label>Battle type</label><select name="type" required><option value="">Select&hellip;</option><option>1 + Done</option><option>2/3</option></select></div>
      <div><label>Format (VS.)</label><select name="vs" required><option value="">Select&hellip;</option><option>1v1</option><option>2v2</option><option>Series</option></select></div>
    </div>
    <div class="row2">
      <div><label>Powerups?</label><select name="powerups" required><option value="">Select&hellip;</option><option>NPU</option><option>PU</option></select></div>
      <div><label>Diamond estimate</label><select name="diamond" required><option value="">Select&hellip;</option><option>0-5K</option><option>5-10K</option><option>10-20K</option><option>20-30K</option><option>30-40K</option><option>40-50K</option><option>50-75K</option><option>75-100K</option><option>100K+</option></select></div>
    </div>
    <div id="c2wrap" style="display:none">
      <label>Second creator <small>(2v2 &middot; TikTok username)</small></label>
      <input name="creator2" maxlength="40" placeholder="secondcreator">
      <label>Second creator est. diamonds</label>
      <select name="diamond2"><option value="">Select&hellip;</option><option>0-5K</option><option>5-10K</option><option>10-20K</option><option>20-30K</option><option>30-40K</option><option>40-50K</option><option>50-75K</option><option>75-100K</option><option>100K+</option></select>
    </div>
    <label>18+ <small>(TikTok live setting)</small></label>
    <select name="adult" required><option value="">Select&hellip;</option><option value="Yes">ON</option><option value="No">OFF</option></select>
    <label>Notes <small>(optional)</small></label>
    <textarea name="notes" maxlength="500" placeholder="Opponent preferences, anything we should know&hellip;"></textarea>
    <input class="hp" name="website" tabindex="-1" autocomplete="off">
    <div class="err" id="err" role="alert"></div>
    <button class="accept" id="go" type="submit">Submit request</button>
  </form>
  <div class="done" id="done"><h2>You're in the queue!</h2><p>We got your request and will reach out on Discord once your battle is confirmed.</p><button class="accept" type="button" id="again" style="margin-top:18px;max-width:320px">Submit another</button></div>
</main>
<script>
var API = 'https://script.google.com/macros/s/AKfycbysJCwJg4qKWrTiL5HMG1gG4w9LRCx0xlrwXkEVJwlZpC9KqsL8-YIedVtpgKkCf-hqvA/exec';
function api(name, params, data) {
  var q = new URLSearchParams({ api: name });
  Object.keys(params || {}).forEach(function (k) { q.set(k, params[k]); });
  if (data) q.set('data', JSON.stringify(data));
  return fetch(API + '?' + q.toString(), { redirect: 'follow' })
    .then(function (r) { return r.json(); })
    .then(function (j) { if (!j.ok) throw new Error(j.error || 'Something went wrong'); return j.result; });
}
var f = document.getElementById('f'), err = document.getElementById('err'), go = document.getElementById('go');
var today = new Date(); today.setMinutes(today.getMinutes() - today.getTimezoneOffset());
document.getElementById('date').min = today.toISOString().slice(0, 10);
f.vs.addEventListener('change', function () {
  document.getElementById('c2wrap').style.display = f.vs.value === '2v2' ? 'block' : 'none';
  f.creator2.required = f.diamond2.required = f.vs.value === '2v2';
});
f.addEventListener('submit', function (e) {
  e.preventDefault();
  if (f.website.value) return;
  err.textContent = '';
  go.disabled = true; go.textContent = 'Sending\u2026';
  var d = {};
  ['username','discord','date','time','backup','type','vs','powerups','diamond','notes','creator2','diamond2','adult'].forEach(function (k) { d[k] = f[k].value; });
  api('submit', {}, d).then(function () {
    f.style.display = 'none';
    document.getElementById('done').style.display = 'block';
    window.scrollTo(0, 0);
  }).catch(function (x) {
    err.textContent = (x && x.message || 'Something went wrong').replace(/^Error:\s*/, '');
    go.disabled = false; go.textContent = 'Submit request';
  });
});
document.getElementById('again').onclick = function () {
  f.reset(); f.style.display = 'block'; document.getElementById('done').style.display = 'none';
  document.getElementById('c2wrap').style.display = 'none';
  go.disabled = false; go.textContent = 'Submit request';
};
</script></body></html>
